<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./sign.css">
    <title>VULPRY | SIGN-IN</title>
</head>

<body>

```
<div class="container">

    <div class="left">

        <div class="logo">
            <span class="white">VUL</span><span class="blue">PRY</span>
        </div>

        <h1>Crie a sua Conta</h1>

        <p>
            Entre para acessar sua plataforma ASPM inteligente
            e gerenciar suas aplicações com segurança.
        </p>

    </div>

    <div class="right">

        <div class="card">

            <h2>Sign-In</h2>

            <form id="cadastroForm">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome"
                    required
                >

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="********"
                    required
                >

                <label for="confirmarSenha">Confirmar senha</label>

                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="********"
                    required
                >

                <div class="options">
                </div>

                <button
                    type="submit"
                    id="cadastroBtn"
                >
                    Criar Conta
                </button>

            </form>

            <div class="divider">
                <span>OU</span>
            </div>

            <p class="register">
                Já possui uma conta?
                <a href="./login.html">Entrar</a>
            </p>

        </div>
    </div>
</div>

<script src="./cadastro.js"></script>

</body>
</html>
